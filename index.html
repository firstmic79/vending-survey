<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loading Vending Survey...</title>
</head>
<body>
<script>
window.addEventListener('DOMContentLoaded', () => {
    // 1. Grab the exact ?location= text from your scanned QR code
    const currentParams = window.location.search;
    
    // 2. Read the customer's phone language setting
    const userLanguage = navigator.language || navigator.userLanguage;
    const isSpanish = userLanguage.toLowerCase().startsWith('es');
    
    // 3. Define the base target directory path explicitly to prevent 404 drops
    const baseDir = 'https://github.io';
    
    // 4. Force the router to use your exact local survey filenames
    let destinationFile = 'vending_survey.html'; 
    if (isSpanish) {
        destinationFile = 'vending_survey_es.html';
    }
    
    // 5. Fire open the exact webpage with zero folder stripping
    window.location.href = baseDir + destinationFile + currentParams;
});
</script>
</body>
</html>
