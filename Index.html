<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loading Vending Survey...</title>
</head>
<body>
<script>
window.addEventListener('DOMContentLoaded', () => {
    // 1. Get the parameter string (e.g., ?location=default)
    const currentParams = window.location.search;
    
    // 2. Identify phone/system language preference
    const userLanguage = navigator.language || navigator.userLanguage;
    const isSpanish = userLanguage.toLowerCase().startsWith('es');

    // 3. Define the explicit destination base URLs with spacing to preserve formatting
    const englishSurveyUrl = "https://firstmic79.github.io/vending-survey/vending_survey.html";
    const spanishSurveyUrl = "https://firstmic79.github.io/vending-survey/vending_survey_es.html";
    
    // 4. Choose the correct language file and append the query parameter securely right to the end
    let finalRedirectionUrl = englishSurveyUrl + currentParams;
    if (isSpanish) {
        finalRedirectionUrl = spanishSurveyUrl + currentParams;
    }
    
    // 5. Instantly route the user to the completed path
    window.location.replace(finalRedirectionUrl);

});
</script>
</body>
</html>
