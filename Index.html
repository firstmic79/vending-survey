<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loading Vending Survey...</title>
</head>
<body>
<script>
window.addEventListener('DOMContentLoaded', () => {
    // 1. Get the parameter string (e.g., ?location=default)
    const currentParams = window.location.search;
    
    // 2. Identify phone/system language preference
    const userLanguage = navigator.language || navigator.userLanguage;
    const isSpanish = userLanguage.toLowerCase().startsWith('es');
    
    // 3. FORCE THE ROUTER TO USE RELATIVE SUBDIRECTORY PATHS
    // We remove any leading slashes to keep the user inside your folder layout
    let destinationFile = 'vending_survey.html'; 
    if (isSpanish) {
        destinationFile = 'vending_survey_es.html';
    }
    
    // 4. Cleanly transition the browser window forward
    window.location.href = destinationFile + currentParams;
});
</script>
</body>
</html>
