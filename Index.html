<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loading Vending Survey...</title>
</head>
<body>
<script>
window.addEventListener('DOMContentLoaded', () => {
    // 1. Get the parameter string (e.g., ?location=default)
    const currentParams = window.location.search;
    
    // 2. Identify phone/system language preference
    const userLanguage = navigator.language || navigator.userLanguage;
    const isSpanish = userLanguage.toLowerCase().startsWith('es');
    
    // 3. Automatically discover the exact folder path we are sitting in
    // This extracts "/vending-survey/" dynamically regardless of your username
    const currentPath = window.location.pathname;
    const folderPath = currentPath.endsWith('/') ? currentPath : currentPath.substring(0, currentPath.lastIndexOf('/') + 1);
    
    // 4. Match your exact repository filenames cleanly
    let destinationFile = 'vending_survey.html'; 
    if (isSpanish) {
        destinationFile = 'vending_survey_es.html';
    }
    
    // 5. Securely route the window using an absolute path anchor
    window.location.href = window.location.origin + folderPath + destinationFile + currentParams;
});
</script>
</body>
</html>
